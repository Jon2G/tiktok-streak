name: Save my streak
on:
  schedule:
    - cron: '11 * * * *' # Run at 11:* every day
jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.10
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set up environment variables
        run: echo "CAPTCHA_API_KEY=${{ secrets.CAPTCHA_API_KEY }}" >> $GITHUB_ENV
        run: echo "TIKTOK_USERNAME=${{ secrets.TIKTOK_USERNAME }}" >> $GITHUB_ENV
        run: echo "TIKTOK_PASSWORD=${{ secrets.TIKTOK_PASSWORD }}" >> $GITHUB_ENV
        run: echo "MESSAGE=${{ secrets.MESSAGE }}" >> $GITHUB_ENV
        run: echo "TIKTOK_FRIEND_USERNAME=${{ secrets.TIKTOK_FRIEND_USERNAME }}" >> $GITHUB_ENV

      - name: Write environment variables to .env file
        run: echo "CAPTCHA_API_KEY=${{ secrets.CAPTCHA_API_KEY }}" > .env
        run: echo "TIKTOK_USERNAME=${{ secrets.TIKTOK_USERNAME }}" >> .env
        run: echo "TIKTOK_PASSWORD=${{ secrets.TIKTOK_PASSWORD }}" >> .env
        run: echo "MESSAGE=${{ secrets.MESSAGE }}" >> .env
        run: echo "TIKTOK_FRIEND_USERNAME=${{ secrets.TIKTOK_FRIEND_USERNAME }}" >> .env

      - name: Run the script
        run: python main.py